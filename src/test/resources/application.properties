spring.datasource.url=jdbc:h2:mem:auth-server-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.locations=classpath:db/migration/h2
spring.flyway.clean-disabled=true

# OAuth2 / Security Configuration for Tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/authServices