spring.datasource.url=jdbc:h2:mem:auth-server-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:oauth2-schema.sql

# OAuth2 / Security Configuration for Tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/authServices